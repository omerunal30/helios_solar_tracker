; PlatformIO konfigurasyonu - ESP32 (Delta ASDA-B2 + DS3231 + MAX6675)
;
; Build:   pio run
; Yukle:   pio run -t upload
; Monitor: pio device monitor -b 115200

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++14
    -Iinclude
; test_host.cpp host-PC test programidir, Arduino build'ine dahil etme
build_src_filter = +<*.cpp> -<test_host.cpp>
